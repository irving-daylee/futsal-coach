function generatePerformanceInsights(perf) {
  const ins = [];
  if (perf.length < 2) return ins;

  const withDrib = perf.filter(a => a.dribbleAttempts > 0);
  if (withDrib.length >= 3) {
    const allRate = dribbleRate(
      withDrib.reduce((s, a) => s + a.dribbleAttempts, 0),
      withDrib.reduce((s, a) => s + a.dribbleSuccess, 0)
    );
    const recent = withDrib.slice(-5);
    const recentRate = dribbleRate(
      recent.reduce((s, a) => s + a.dribbleAttempts, 0),
      recent.reduce((s, a) => s + a.dribbleSuccess, 0)
    );
    const diff = recentRate - allRate;
    ins.push({
      tag: diff >= 0 ? 'positive' : 'warning',
      tagText: diff >= 0 ? 'Stijgend' : 'Dalend',
      title: `Dribbelsucces: ${recentRate}% recent`,
      body: `Totaal gemiddeld: <span class="insight-stat">${allRate}%</span>. Laatste ${recent.length} activiteiten: <span class="insight-stat">${recentRate}%</span>. ${diff >= 0 ? `<strong>+${diff}%</strong> boven` : `<strong>${diff}%</strong> onder`} je gemiddelde.`
    });
  }

  const withShots = perf.filter(a => a.shots > 0);
  if (withShots.length >= 3) {
    const allConv = conversionRate(
      withShots.reduce((s, a) => s + a.shots, 0),
      withShots.reduce((s, a) => s + a.goals, 0)
    );
    const recent = withShots.slice(-5);
    const recentConv = conversionRate(
      recent.reduce((s, a) => s + a.shots, 0),
      recent.reduce((s, a) => s + a.goals, 0)
    );
    const diff = recentConv - allConv;
    ins.push({
      tag: diff >= 0 ? 'positive' : 'warning',
      tagText: diff >= 0 ? 'Stijgend' : 'Dalend',
      title: `Schotconversie: ${recentConv}% recent`,
      body: `Totaal gemiddeld: <span class="insight-stat">${allConv}%</span>. Recent: <span class="insight-stat">${recentConv}%</span>. ${diff >= 0 ? 'Positieve trend.' : 'Let op: dalende trend.'}`
    });
  }

  let goalStreak = 0;
  for (let i = perf.length - 1; i >= 0; i--) {
    if (perf[i].goals > 0) goalStreak++;
    else break;
  }
  if (goalStreak >= 2) {
    ins.push({
      tag: 'positive', tagText: 'Reeks',
      title: `${goalStreak} activiteiten op rij gescoord`,
      body: `Je scoort al <span class="insight-stat">${goalStreak}</span> activiteiten achtereen. ${goalStreak >= 5 ? 'Indrukwekkende reeks!' : 'Blijf dit vasthouden.'}`
    });
  }

  const positions = {};
  perf.forEach(a => {
    if (!positions[a.mainPosition]) positions[a.mainPosition] = [];
    positions[a.mainPosition].push(a);
  });
  let bestPos = null, bestPosRate = 0;
  Object.entries(positions).forEach(([pos, acts]) => {
    if (acts.length >= 2) {
      const rate = avg(acts.filter(a => a.dribbleAttempts > 0).map(a => dribbleRate(a.dribbleAttempts, a.dribbleSuccess)));
      if (rate > bestPosRate) { bestPosRate = Math.round(rate); bestPos = pos; }
    }
  });
  if (bestPos && Object.keys(positions).length > 1) {
    ins.push({
      tag: 'neutral', tagText: 'Positie',
      title: `Beste dribbels op ${positionLabel(bestPos)}`,
      body: `Op ${positionLabel(bestPos)} haal je gemiddeld <span class="insight-stat">${bestPosRate}%</span> dribbelsucces. ${bestPos === 'flank-links' ? 'Dat is je eigen positie — logisch.' : 'Wellicht iets om vaker te proberen.'}`
    });
  }

  return ins;
}

function generatePreparationInsights(activities) {
  const ins = [];
  const perf = activities.filter(a => a.type === 'match' && a.dribbleAttempts > 0);
  if (perf.length < 4) return ins;

  const tired = perf.filter(a => a.preparation.tiredBody);
  const fresh = perf.filter(a => !a.preparation.tiredBody);
  if (tired.length >= 2 && fresh.length >= 2) {
    const tiredRate = Math.round(avg(tired.map(a => dribbleRate(a.dribbleAttempts, a.dribbleSuccess))));
    const freshRate = Math.round(avg(fresh.map(a => dribbleRate(a.dribbleAttempts, a.dribbleSuccess))));
    const diff = freshRate - tiredRate;
    if (Math.abs(diff) >= 3) {
      ins.push({
        tag: diff > 10 ? 'warning' : 'neutral', tagText: 'Patroon',
        title: diff > 0 ? 'Vermoeidheid kost dribbels' : 'Vermoeidheid geen groot probleem',
        body: `Fris: <span class="insight-stat">${freshRate}%</span> dribbelsucces. Vermoeid: <span class="insight-stat">${tiredRate}%</span>. Verschil: <strong>${Math.abs(diff)}%</strong>. ${diff > 10 ? 'Overweeg betere rust voor wedstrijden.' : ''}`
      });
    }
  }

  const lowConf = perf.filter(a => a.preparation.lowConfidence);
  const hiConf = perf.filter(a => !a.preparation.lowConfidence);
  if (lowConf.length >= 2 && hiConf.length >= 2) {
    const lowAttempts = Math.round(avg(lowConf.map(a => a.dribbleAttempts)));
    const hiAttempts = Math.round(avg(hiConf.map(a => a.dribbleAttempts)));
    const diff = hiAttempts - lowAttempts;
    if (diff > 0) {
      ins.push({
        tag: 'neutral', tagText: 'Zelfvertrouwen',
        title: 'Minder zelfvertrouwen = minder dribbelpogingen',
        body: `Met zelfvertrouwen: <span class="insight-stat">${hiAttempts}</span> dribbelpogingen gemiddeld. Zonder: <span class="insight-stat">${lowAttempts}</span>. Je probeert <strong>${diff} minder</strong> dribbels als je je onzeker voelt.`
      });
    }
  }

  const withWater = perf.filter(a => a.preparation.waterLiters > 0);
  if (withWater.length >= 4) {
    const sorted = [...withWater].sort((a, b) => a.preparation.waterLiters - b.preparation.waterLiters);
    const low = sorted.slice(0, Math.ceil(sorted.length / 2));
    const high = sorted.slice(Math.ceil(sorted.length / 2));
    const lowRate = Math.round(avg(low.map(a => dribbleRate(a.dribbleAttempts, a.dribbleSuccess))));
    const highRate = Math.round(avg(high.map(a => dribbleRate(a.dribbleAttempts, a.dribbleSuccess))));
    if (Math.abs(highRate - lowRate) >= 5) {
      ins.push({
        tag: highRate > lowRate ? 'positive' : 'neutral', tagText: 'Hydratatie',
        title: highRate > lowRate ? 'Meer water = beter presteren' : 'Hydratatie maakt weinig verschil',
        body: `Meer water (>${(avg(high.map(a => a.preparation.waterLiters))).toFixed(1)}L): <span class="insight-stat">${highRate}%</span> dribbel. Minder water: <span class="insight-stat">${lowRate}%</span>.`
      });
    }
  }

  const feelings = {};
  perf.forEach(a => {
    if (!feelings[a.feeling]) feelings[a.feeling] = [];
    feelings[a.feeling].push(a);
  });
  const feelingPerf = Object.entries(feelings).map(([f, acts]) => ({
    feeling: f, rate: Math.round(avg(acts.filter(a => a.dribbleAttempts > 0).map(a => dribbleRate(a.dribbleAttempts, a.dribbleSuccess)))), count: acts.length
  })).filter(f => f.count >= 2).sort((a, b) => b.rate - a.rate);
  if (feelingPerf.length >= 2) {
    const best = feelingPerf[0];
    ins.push({
      tag: 'neutral', tagText: 'Gevoel',
      title: `Beste dribbels bij "${feelingLabel(best.feeling)}"`,
      body: `Bij "${feelingLabel(best.feeling)}": <span class="insight-stat">${best.rate}%</span> dribbelsucces (${best.count}x). ${best.feeling === 'tevreden' || best.feeling === 'zeer tevreden' ? 'Positief gevoel helpt.' : 'Interessant — zelfs met dat gevoel presteer je goed.'}`
    });
  }

  return ins;
}

function generateCoachingInsights(activities, perf) {
  const ins = [];
  if (!activities.length) return ins;

  const last = activities[activities.length - 1];
  const withDrib = perf.filter(a => a.dribbleAttempts > 0);

  if (withDrib.length >= 2) {
    const lastRate = dribbleRate(last.dribbleAttempts, last.dribbleSuccess);
    const target = Math.min(100, lastRate + 2);
    ins.push({
      tag: 'positive', tagText: 'Kaizen',
      title: `Doel volgende keer: ${target}% dribbelsucces`,
      body: `Vorige keer: <span class="insight-stat">${lastRate}%</span>. Kaizen — verbeter met 2%. Doel: <span class="insight-stat">${target}%</span>. Eén verbetering tegelijk, dat is de kracht van kleine stappen.`
    });
  }

  if (perf.length >= 3) {
    const recent3 = perf.slice(-3);
    const trend = recent3.map(a => dribbleRate(a.dribbleAttempts, a.dribbleSuccess));
    const improving = trend[2] > trend[0];
    ins.push({
      tag: 'neutral', tagText: 'PDCA',
      title: improving ? 'Check: positieve trend' : 'Check: tijd voor actie',
      body: improving
        ? `Laatste 3 sessies: ${trend.join('% → ')}%. De trend is positief. <strong>Act:</strong> blijf op deze lijn, pas niet te veel tegelijk aan.`
        : `Laatste 3 sessies: ${trend.join('% → ')}%. De trend is vlak/dalend. <strong>Act:</strong> analyseer wat er anders is. Focus op één specifiek aspect.`
    });
  }

  if (last.feeling && withDrib.length >= 3) {
    const lastRate = dribbleRate(last.dribbleAttempts, last.dribbleSuccess);
    const avgRate = Math.round(avg(withDrib.map(a => dribbleRate(a.dribbleAttempts, a.dribbleSuccess))));
    const positive = last.feeling === 'tevreden' || last.feeling === 'zeer tevreden';
    if (positive && lastRate < avgRate - 8) {
      ins.push({
        tag: 'neutral', tagText: 'Hansei',
        title: 'Eerlijke reflectie: gevoel vs. cijfers',
        body: `Je gaf jezelf "${feelingLabel(last.feeling)}", maar je dribbelsucces was <span class="insight-stat">${lastRate}%</span> — <strong>${avgRate - lastRate}%</strong> onder je gemiddelde (${avgRate}%). Hansei: wat ging er écht goed, en wat kan scherper?`
      });
    }
    if (!positive && lastRate > avgRate + 5) {
      ins.push({
        tag: 'positive', tagText: 'Hansei',
        title: 'Beter dan je denkt',
        body: `Je gaf jezelf "${feelingLabel(last.feeling)}", maar je dribbelsucces was <span class="insight-stat">${lastRate}%</span> — <strong>${lastRate - avgRate}%</strong> boven je gemiddelde. Vertrouw je data: je presteerde goed.`
      });
    }
  }

  const streak = calcActivityStreak();
  if (streak >= 2) {
    ins.push({
      tag: 'positive', tagText: 'Gambatte',
      title: `${streak} weken op rij actief`,
      body: `Consistentie is de basis van groei. Je bent al <span class="insight-stat">${streak} weken</span> op rij bezig. Gambatte — blijf dit volhouden.`
    });
  }

  if (activities.length >= 3) {
    const focusActivities = activities.filter(a => a.focusPoints && a.focusPoints.length > 0);
    if (focusActivities.length >= 2) {
      const allFocus = focusActivities.flatMap(a => a.focusPoints);
      const total = allFocus.length;
      const gehaald = allFocus.filter(fp => fp.result === 'gehaald').length;
      const rate = Math.round((gehaald / total) * 100);
      ins.push({
        tag: rate >= 60 ? 'positive' : 'neutral', tagText: 'Focus',
        title: `${rate}% van je focuspunten gehaald`,
        body: `${gehaald} van ${total} focuspunten volledig gehaald. ${rate >= 60 ? 'Sterk — je focusaanpak werkt.' : 'Stel scherpere, kleinere focuspunten in.'}`
      });
    }
  }

  return ins;
}

function generateCareerInsights() {
  const ins = [];
  const matchPerf = DB.activities.filter(a => a.type === 'match');
  if (!matchPerf.length) return ins;

  const thisSeasonGoals = matchPerf.reduce((s, a) => s + (a.goals || 0), 0);
  const thisSeasonAssists = matchPerf.reduce((s, a) => s + (a.assists || 0), 0);
  const thisSeasonPlayed = matchPerf.length;

  const histGoals = DB.historicalSeasons.reduce((s, hs) => s + (hs.comp.goals || 0) + (hs.friendly.goals || 0) + (hs.cup.goals || 0), 0);
  const histAssists = DB.historicalSeasons.reduce((s, hs) => s + (hs.comp.assists || 0) + (hs.friendly.assists || 0) + (hs.cup.assists || 0), 0);
  const histPlayed = DB.historicalSeasons.reduce((s, hs) => s + (hs.comp.played || 0) + (hs.friendly.played || 0) + (hs.cup.played || 0), 0);

  ins.push({
    tag: 'neutral', tagText: 'Carrière',
    title: 'All-time statistieken',
    body: `Totaal: <span class="insight-stat">${histGoals + thisSeasonGoals}</span> goals, <span class="insight-stat">${histAssists + thisSeasonAssists}</span> assists in <span class="insight-stat">${histPlayed + thisSeasonPlayed}</span> duels. Dit seizoen: ${thisSeasonGoals}G, ${thisSeasonAssists}A in ${thisSeasonPlayed} activiteiten.`
  });

  if (thisSeasonPlayed >= 3 && histPlayed > 0) {
    const histGPG = histGoals / histPlayed;
    const thisGPG = thisSeasonGoals / thisSeasonPlayed;
    const diff = thisGPG - histGPG;
    ins.push({
      tag: diff >= 0 ? 'positive' : 'warning',
      tagText: diff >= 0 ? 'Groei' : 'Aandacht',
      title: `${thisGPG.toFixed(2)} goals/wedstrijd dit seizoen`,
      body: `Historisch gemiddelde: <span class="insight-stat">${histGPG.toFixed(2)}</span> goals/wedstrijd. Dit seizoen: <span class="insight-stat">${thisGPG.toFixed(2)}</span>. ${diff >= 0 ? 'Je scoort beter dan je historisch gemiddelde.' : 'Onder je historisch gemiddelde — focus op afronding.'}`
    });
  }

  return ins;
}

function handlePhotoUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      canvas.width = 200;
      canvas.height = 200;
      const ctx = canvas.getContext('2d');
      const size = Math.min(img.width, img.height);
      const sx = (img.width - size) / 2;
      const sy = (img.height - size) / 2;
      ctx.drawImage(img, sx, sy, size, size, 0, 0, 200, 200);
      DB.profile.photo = canvas.toDataURL('image/jpeg', 0.8);
      saveData();
      renderProfiel();
      showToast('Foto opgeslagen');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

  h += `<div class="stat-grid stat-grid-3">
    <div class="stat-box"><div class="stat-value">${matches.length}</div><div class="stat-label">Wedstrijden</div></div>
    <div class="stat-box"><div class="stat-value">${trainings.length}</div><div class="stat-label">Trainingen</div></div>
    <div class="stat-box"><div class="stat-value">${zaaltjes.length}</div><div class="stat-label">Zaaltjes</div></div>
  </div>`;
  h += `<div class="section-title" style="font-size:0.7rem">Prestaties (wedstrijden)</div>`;
  h += `<div class="stat-grid">
    <div class="stat-box"><div class="stat-value">${totalG}</div><div class="stat-label">Goals</div></div>
    <div class="stat-box"><div class="stat-value">${totalA}</div><div class="stat-label">Assists</div></div>
    <div class="stat-box"><div class="stat-value">${gaRatio}</div><div class="stat-label">G/A ratio</div></div>
    <div class="stat-box"><div class="stat-value">${convRate}%</div><div class="stat-label">Conversie</div></div>
  </div>`;
  h += `<div class="stat-grid stat-grid-2">
    <div class="stat-box"><div class="stat-value">${goalsPerMatch}</div><div class="stat-label">Goals / wed</div></div>
    <div class="stat-box"><div class="stat-value">${avgDR}%</div><div class="stat-label">Dribbel%</div></div>
  </div>`;

  const matchDrib = perf.filter(a => a.type === 'match' && a.dribbleAttempts > 0);
  const trainDrib = perf.filter(a => a.type === 'training' && a.dribbleAttempts > 0);
  const matchDribTotal = matchDrib.reduce((s, a) => s + a.dribbleSuccess, 0);
  const matchDribAttempts = matchDrib.reduce((s, a) => s + a.dribbleAttempts, 0);
  const trainDribTotal = trainDrib.reduce((s, a) => s + a.dribbleSuccess, 0);
  const trainDribAttempts = trainDrib.reduce((s, a) => s + a.dribbleAttempts, 0);
  const matchDribRate = matchDribAttempts > 0 ? Math.round((matchDribTotal / matchDribAttempts) * 100) : 0;
  const trainDribRate = trainDribAttempts > 0 ? Math.round((trainDribTotal / trainDribAttempts) * 100) : 0;
  const matchDribPerAct = matchDrib.length ? (matchDribTotal / matchDrib.length).toFixed(1) : '0';
  const trainDribPerAct = trainDrib.length ? (trainDribTotal / trainDrib.length).toFixed(1) : '0';

  h += `<div class="section-title">Dribbels — Wedstrijden</div>`;
  h += `<div class="stat-grid">
    <div class="stat-box"><div class="stat-value">${matchDribAttempts}</div><div class="stat-label">Pogingen</div></div>
    <div class="stat-box"><div class="stat-value">${matchDribTotal}</div><div class="stat-label">Geslaagd</div></div>
    <div class="stat-box"><div class="stat-value">${matchDribRate}%</div><div class="stat-label">Succes%</div></div>
    <div class="stat-box"><div class="stat-value">${matchDribPerAct}</div><div class="stat-label">Per wed.</div></div>
  </div>`;

  h += `<div class="section-title">Dribbels — Trainingen</div>`;
  h += `<div class="stat-grid">
    <div class="stat-box"><div class="stat-value">${trainDribAttempts}</div><div class="stat-label">Pogingen</div></div>
    <div class="stat-box"><div class="stat-value">${trainDribTotal}</div><div class="stat-label">Geslaagd</div></div>
    <div class="stat-box"><div class="stat-value">${trainDribRate}%</div><div class="stat-label">Succes%</div></div>
    <div class="stat-box"><div class="stat-value">${trainDribPerAct}</div><div class="stat-label">Per training</div></div>
  </div>`;

  h += `<div class="section-title">Carrière</div>`;
  h += `<div class="pp-season">`;

  const matchActivities = DB.activities.filter(a => a.type === 'match');
  const currentSeason = DB.settings.currentSeason;
  let allTimeG = 0, allTimeA = 0, allTimeP = 0;

  ['KNVB', 'SRZA'].forEach(bond => {
    h += `<div class="pp-season-header">${bond}</div>`;
    let bondG = 0, bondA = 0, bondP = 0;

    const bondSeasons = DB.historicalSeasons.filter(s => s.bond === bond);
    bondSeasons.forEach(s => {
      const played = (s.comp.played || 0) + (s.friendly.played || 0) + (s.cup.played || 0);
      const goals = (s.comp.goals || 0) + (s.friendly.goals || 0) + (s.cup.goals || 0);
      const assists = (s.comp.assists || 0) + (s.friendly.assists || 0) + (s.cup.assists || 0);
      bondG += goals; bondA += assists; bondP += played;
      h += `<div class="pp-season-row">
        <span class="pp-season-label"><span class="team-dot ${teamColorClass(s.team)}"></span>${s.season} ${s.team}</span>
        <div class="pp-season-stats">
          <span class="pp-season-stat"><strong>${played}</strong> wed</span>
          <span class="pp-season-stat"><strong>${goals}</strong> G</span>
          <span class="pp-season-stat"><strong>${assists}</strong> A</span>
        </div>
      </div>`;
    });

    const bondMatches = matchActivities.filter(a => a.bond === bond);
    if (bondMatches.length) {
      const bmG = bondMatches.reduce((s, a) => s + (a.goals || 0), 0);
      const bmA = bondMatches.reduce((s, a) => s + (a.assists || 0), 0);
      const bmTeam = bondMatches[0].team;
      bondG += bmG; bondA += bmA; bondP += bondMatches.length;
      h += `<div class="pp-season-row">
        <span class="pp-season-label"><span class="team-dot ${teamColorClass(bmTeam)}"></span>${currentSeason} ${bmTeam}</span>
        <div class="pp-season-stats">
          <span class="pp-season-stat"><strong>${bondMatches.length}</strong> wed</span>
          <span class="pp-season-stat"><strong>${bmG}</strong> G</span>
          <span class="pp-season-stat"><strong>${bmA}</strong> A</span>
        </div>
      </div>`;
    }

    h += `<div class="pp-season-row subtotal">
      <span class="pp-season-label">Totaal ${bond}</span>
      <div class="pp-season-stats">
        <span class="pp-season-stat"><strong>${bondP}</strong> wed</span>
        <span class="pp-season-stat"><strong>${bondG}</strong> G</span>
        <span class="pp-season-stat"><strong>${bondA}</strong> A</span>
      </div>
    </div>`;

    allTimeG += bondG; allTimeA += bondA; allTimeP += bondP;
  });

  h += `<div class="pp-season-row total">
    <span class="pp-season-label">All-time</span>
    <div class="pp-season-stats">
      <span class="pp-season-stat"><strong>${allTimeP}</strong> wed</span>
      <span class="pp-season-stat"><strong>${allTimeG}</strong> G</span>
      <span class="pp-season-stat"><strong>${allTimeA}</strong> A</span>
    </div>
  </div>`;
  h += `</div>`;

  h += `<button class="btn btn-outline btn-block btn-sm mt-16" onclick="exportData()">Data exporteren (JSON)</button>`;

  c.innerHTML = h;
}

function exportData() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `futsal-coach-backup-${new Date().toISOString().split('T')[0]}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup gedownload');
}

function confirmReset() {
  openModal(`
    <div class="modal-title">Alle data wissen?</div>
    <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:20px">Dit verwijdert alle evaluaties, doelen en instellingen. Exporteer eerst een backup als je je data wilt bewaren.</p>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline" style="flex:1" onclick="closeModal()">Annuleren</button>
      <button class="btn btn-danger" style="flex:1" onclick="resetAllData()">Wissen</button>
    </div>
  `);
}

function resetAllData() {
  localStorage.removeItem(STORAGE_KEY);
  DB = defaultData();
  closeModal();
  showToast('Alle data gewist');
  navigateTo('pageDashboard');
}

/* ============================================================
   INIT
   ============================================================ */

document.getElementById('appVersion').textContent = 'v' + APP_VERSION;
renderDashboard();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

</script>
</body>
</html>
